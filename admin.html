<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>KOVA order desk</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#242520;background:#f5f4ef}*{box-sizing:border-box}body{margin:0}header{background:#22231f;color:#fff;padding:22px max(24px,5vw);display:flex;justify-content:space-between;align-items:center}header strong{letter-spacing:.14em}main{max-width:1100px;margin:36px auto;padding:0 22px}.top{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}h1{font-size:30px;margin:0 0 6px}p{color:#777970;margin:0}.btn{background:#242520;color:white;border:0;padding:11px 16px;cursor:pointer}.btn.secondary{background:transparent;border:1px solid #aaa;color:#222}.card{background:#fff;border:1px solid #e3e1d8;padding:18px;margin:14px 0}.order{display:grid;grid-template-columns:1.2fr 1fr auto;gap:20px;align-items:start}.order h2{font-size:15px;margin:0 0 6px}.meta{font-size:12px;color:#777;line-height:1.7}.pill{font-size:11px;border-radius:20px;background:#edece5;padding:5px 10px;display:inline-block;margin:3px}.controls{display:flex;flex-direction:column;gap:8px;min-width:210px}.controls input,.controls select,input{padding:10px;border:1px solid #d9d7cf;background:#fff}.empty{background:white;padding:40px;text-align:center;color:#777}.login{position:fixed;inset:0;display:grid;place-items:center;background:#f5f4ef}.login form{width:min(400px,90vw);background:#fff;padding:28px;border:1px solid #ddd;display:grid;gap:13px}.error{color:#a43e29;font-size:13px;min-height:18px}@media(max-width:700px){.order{grid-template-columns:1fr}.controls{min-width:0}.top{align-items:start;flex-direction:column}}
</style></head><body>
<header><strong>KOVA <span style="color:#bd6745">.</span> ORDER DESK</strong><button class="btn secondary" onclick="logout()">Sign out</button></header>
<div class="login" id="login"><form onsubmit="login(event)"><h1>Order desk</h1><p>Enter the admin access token configured for the store.</p><input id="token" type="password" autocomplete="current-password" placeholder="Admin token" required><button class="btn">Continue</button><div id="login-error" class="error"></div></form></div>
<main><div class="top"><div><h1>Orders</h1><p>Confirm payment, then fulfill and add carrier tracking.</p></div><button class="btn" onclick="refreshAll()">Refresh</button></div><div id="orders"><div class="empty">Sign in to load orders.</div></div><div class="top" style="margin-top:48px"><div><h1>Products</h1><p>New items stay hidden until supplier stock is confirmed.</p></div></div><form class="card" onsubmit="createProduct(event)" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px"><strong style="grid-column:1/-1">Add product</strong><input name="slug" placeholder="product-slug" required><input name="name" placeholder="Product name" required><input name="category" placeholder="Category" required><input name="price_php" type="number" min="1" placeholder="Price in PHP" required><input name="supplier_name" placeholder="Supplier name"><input name="supplier_sku" placeholder="Supplier SKU"><input name="image_url" type="url" placeholder="HTTPS product photo URL"><textarea name="description" placeholder="Verified product description" required style="grid-column:1/-1;padding:10px;border:1px solid #d9d7cf"></textarea><button class="btn" style="grid-column:1/-1">Save as unverified</button><div id="product-error" class="error" style="grid-column:1/-1"></div></form><div id="products"><div class="empty">Sign in to load products.</div></div></main>
<script>
let token=sessionStorage.getItem("kova-admin-token")||"";
function showLogin(show){document.getElementById("login").style.display=show?"grid":"none"}
function login(e){e.preventDefault();token=document.getElementById("token").value;sessionStorage.setItem("kova-admin-token",token);loadOrders();loadProducts()}
function logout(){sessionStorage.removeItem("kova-admin-token");token="";showLogin(true);document.getElementById("orders").innerHTML='<div class="empty">Sign in to load orders.</div>'}
async function request(path,options={}){const r=await fetch(path,{...options,headers:{"Content-Type":"application/json",Authorization:"Bearer "+token,...options.headers}});const data=await r.json();if(!r.ok)throw new Error(data.error||"Request failed");return data}
async function loadOrders(){try{const {orders}=await request("/api/admin-orders");showLogin(false);document.getElementById("orders").innerHTML=orders.length?orders.map(o=>`<article class="card"><div class="order"><div><h2>${escapeHtml(o.order_number)} <span class="pill">${escapeHtml(o.payment_status)}</span><span class="pill">${escapeHtml(o.fulfillment_status)}</span></h2><div class="meta">${escapeHtml(o.customer_name)} · ${escapeHtml(o.customer_email)} · ${escapeHtml(o.customer_phone)}<br>${escapeHtml(o.address_line1)} ${escapeHtml(o.address_line2||"")}, ${escapeHtml(o.city)}, ${escapeHtml(o.province)} ${escapeHtml(o.postal_code)}<br>Order placed: ${new Date(o.created_at).toLocaleString()}</div></div><div><strong>₱${Number(o.total_php).toLocaleString()}</strong><div class="meta">Items: ${o.order_items?.map(i=>escapeHtml(i.product_name)+" × "+i.quantity).join(", ")||"—"}</div></div><div class="controls"><select id="status-${o.id}"><option>unfulfilled</option><option>processing</option><option>shipped</option><option>delivered</option><option>cancelled</option></select><input id="tracking-${o.id}" placeholder="Tracking number" value="${escapeAttr(o.tracking_number||"")}"><input id="url-${o.id}" placeholder="https://carrier/tracking" value="${escapeAttr(o.tracking_url||"")}"><button class="btn" onclick="save('${o.id}')">Save fulfillment</button></div></div></article>`).join(""):'<div class="empty">No orders yet.</div>';for(const o of orders){document.getElementById("status-"+o.id).value=o.fulfillment_status}}catch(e){showLogin(true);document.getElementById("login-error").textContent=e.message;document.getElementById("orders").innerHTML='<div class="empty">Could not load orders.</div>'}}
async function loadProducts(){try{const {products}=await request("/api/admin-products");document.getElementById("products").innerHTML=products.length?products.map(p=>`<article class="card"><div class="order"><div><h2>${escapeHtml(p.name)} <span class="pill">${escapeHtml(p.stock_status)}</span>${p.active?'<span class="pill">listed</span>':'<span class="pill">hidden</span>'}</h2><div class="meta">${escapeHtml(p.slug)} · ${escapeHtml(p.supplier_name||"Supplier pending")} · SKU ${escapeHtml(p.supplier_sku||"pending")}<br>${escapeHtml(p.description)}</div></div><div><label class="meta">Price ₱<input id="price-${p.id}" type="number" min="1" value="${Number(p.price_php)}"></label><label class="meta">Stock<select id="stock-${p.id}"><option>unverified</option><option>available</option><option>out_of_stock</option></select></label></div><div class="controls"><label><input id="active-${p.id}" type="checkbox" ${p.active?'checked':''}> Listed</label><button class="btn" onclick="saveProduct('${p.id}')">Save product</button></div></div></article>`).join(""):'<div class="empty">No products yet.</div>';for(const p of products)document.getElementById("stock-"+p.id).value=p.stock_status}catch(e){document.getElementById("products").innerHTML='<div class="empty">Products could not be loaded.</div>'}}
async function createProduct(e){e.preventDefault();const form=e.currentTarget;const body=Object.fromEntries(new FormData(form));body.price_php=Number(body.price_php);try{await request("/api/admin-products",{method:"POST",body:JSON.stringify(body)});form.reset();document.getElementById("product-error").textContent="Added hidden. Verify stock and supplier details before listing.";await loadProducts()}catch(e){document.getElementById("product-error").textContent=e.message}}
async function saveProduct(id){try{await request("/api/admin-products",{method:"PATCH",body:JSON.stringify({id,price_php:Number(document.getElementById("price-"+id).value),stock_status:document.getElementById("stock-"+id).value,active:document.getElementById("active-"+id).checked})});await loadProducts()}catch(e){alert(e.message)}}
function refreshAll(){loadOrders();loadProducts()}
async function save(id){const status=document.getElementById("status-"+id).value;try{await request("/api/admin-orders",{method:"PATCH",body:JSON.stringify({id,fulfillment_status:status,tracking_number:document.getElementById("tracking-"+id).value||null,tracking_url:document.getElementById("url-"+id).value||null})});await loadOrders()}catch(e){alert(e.message)}}
function escapeHtml(x){return String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}function escapeAttr(x){return escapeHtml(x)}
if(token){document.getElementById("token").value=token;loadOrders();loadProducts()}else showLogin(true);
</script></body></html>
